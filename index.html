<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SecondVoice · 为你想说的话准备的声音</title>
<meta name="description" content="SecondVoice：写下一句话，让它替你说出来。念的时候可以继续改，随时打断，随时修订 —— 草稿和你已经说出口的那句话是两回事。" />
<meta name="theme-color" content="#0a0d11" />
<meta property="og:title" content="SecondVoice · 第二声音" />
<meta property="og:description" content="写下来，念出来，随时打断重说。为说不出口的那一刻准备的声音。" />
<link rel="stylesheet" href="./styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0d11'/%3E%3Cpath d='M5 16c3-6 5-6 6 0s3 6 5 0 3-6 5 0 3 5 6 0' stroke='%23d3472b' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
<div class="beam" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 44 24" aria-hidden="true">
      <path d="M2 12c3.6-7 6-7 7.4 0s3.8 7 5.6 0 3.8-7 5.6 0 3.8 6 5.4 0 3.6-5.4 5.4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="39" cy="12" r="2" fill="currentColor"/>
    </svg>
    <div class="brand-text">
      <h1>Second<span>Voice</span></h1>
      <p>为你想说的话，准备一个声音</p>
    </div>
  </div>

  <div class="prefs">
    <button class="pill" id="contrastBtn" aria-pressed="false">高对比</button>
    <button class="pill" id="typeBtn" aria-pressed="false">大字</button>
    <button class="pill" id="shareBtn">分享</button>
    <a class="pill pill-link" href="https://github.com/le3334515-tech/SecondVoice" target="_blank" rel="noopener">GitHub ↗</a>
  </div>
</header>

<main class="stage">
  <!-- ── 左：草稿 ─────────────────────────────────── -->
  <section class="draft-col" aria-label="草稿">
    <div class="paper">
      <div class="paper-head">
        <span class="label">DRAFT&nbsp;·&nbsp;你要说的话</span>
        <span class="meta" id="draftCount">0 / 1800</span>
      </div>
      <label class="sr-only" for="draft">草稿</label>
      <textarea id="draft" maxlength="1800" spellcheck="false"
        placeholder="写下来。念的时候你可以继续改 —— 正在被念出去的是「已经交给声音的那一版」，跟这张纸不是一回事。"></textarea>
      <div class="paper-foot">
        <button class="speak" id="speakBtn">
          <span id="speakLabel">念出来</span>
          <kbd>⌘ / Ctrl ↵</kbd>
        </button>
        <button class="ghost" id="savePhraseBtn" disabled>存为短语</button>
      </div>
    </div>

    <div class="block">
      <div class="block-head"><span class="label">起手句</span></div>
      <div class="chips" id="starterList"></div>
    </div>

    <div class="block">
      <div class="block-head">
        <span class="label">已存短语&nbsp;·&nbsp;<span id="savedCount">0 / 12</span></span>
        <button class="link" id="clearSaved" hidden>清空</button>
      </div>
      <div class="chips" id="savedList"></div>
      <p class="hint" id="savedHint">存在这台浏览器里，最多 12 条。</p>
    </div>
  </section>

  <!-- ── 右：舞台 ─────────────────────────────────── -->
  <section class="voice-col" aria-label="声音">
    <div class="notice" id="notice" aria-live="polite">写下想法，或者挑一句起手句 —— 它只会念你批准的那一版。</div>

    <div class="msg" id="msg">
      <p class="msg-empty" id="msgEmpty">还没有交给声音的消息。</p>
      <div class="msg-words" id="msgWords" aria-hidden="true"></div>
    </div>

    <div class="ribbon-wrap">
      <canvas id="ribbon" height="86"></canvas>
      <div class="cut" id="cut" hidden><span>打断在这儿</span></div>
    </div>

    <div class="controls">
      <button class="ctrl primary" id="playBtn">▶&nbsp;播放</button>
      <button class="ctrl" id="stopBtn" disabled>■&nbsp;停止</button>
      <button class="ctrl" id="reviseBtn" disabled>✎&nbsp;修订这句</button>
      <button class="ctrl" id="reuseBtn" disabled>↻&nbsp;再念一次</button>
      <span class="meta status" id="statusMeta">就绪</span>
    </div>

    <div class="tuning">
      <label class="tune">
        <span>音色</span>
        <select id="voiceSelect"></select>
      </label>
      <label class="tune">
        <span>语速</span>
        <input id="rate" type="range" min="0.6" max="1.5" step="0.05" value="1" />
        <output id="rateOut">1.00×</output>
      </label>
      <label class="tune">
        <span>音高</span>
        <input id="pitch" type="range" min="0.6" max="1.6" step="0.05" value="1" />
        <output id="pitchOut">1.00×</output>
      </label>
      <button class="ghost small" id="previewBtn">试听</button>
    </div>

    <div class="diff" id="diffWrap" hidden>
      <div class="diff-head">
        <span class="label">与上一版的差别</span>
        <span class="meta" id="diffStat"></span>
      </div>
      <div class="diff-body" id="diffBody"></div>
    </div>

    <div class="history">
      <div class="history-head">
        <span class="label">对话记录</span>
        <span class="meta" id="historyMeta">0 条</span>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
